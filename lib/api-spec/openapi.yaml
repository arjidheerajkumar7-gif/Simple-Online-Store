openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shop
    description: Store catalog and order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [shop]
      summary: List active products
      description: Returns the active products available in the storefront
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "503":
          description: Store database is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /orders:
    post:
      operationId: createOrder
      tags: [shop]
      summary: Save a customer order
      description: Saves an order in the store database without collecting payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReceipt"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Store database is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        price:
          type: number
          format: double
        image:
          type: string
        description:
          type: string
        badge:
          type: ["string", "null"]
        tint:
          type: string
      required:
        - id
        - name
        - category
        - price
        - image
        - description
        - badge
        - tint
    OrderLineInput:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 50
      required:
        - productId
        - quantity
    OrderInput:
      type: object
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 200
        customerEmail:
          type: string
          format: email
          maxLength: 320
        shippingAddress:
          type: string
          minLength: 1
          maxLength: 500
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/OrderLineInput"
      required:
        - customerName
        - customerEmail
        - shippingAddress
        - items
    OrderReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        totalCents:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - totalCents
        - createdAt
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

